<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup preview</title>
  <link rel="stylesheet" href="/popup.css">
  <script src="/tests/manual/chrome-stub.js"></script>
  <script src="/src/schedule.js"></script>
</head>
<body>
  <!-- Serve the repo root (python3 -m http.server 8765) and open /tests/manual/popup-preview.html. -->
  <script type="module">
    const html = await (await fetch('/popup.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    for (const img of doc.querySelectorAll('img[src^="images/"]')) img.src = `/${img.getAttribute('src')}`;
    document.body.replaceChildren(...doc.body.childNodes);
    await import('/popup.js');
  </script>
</body>
</html>
